kind = "web"
previewPath = "/"
title = "3D Shooter Game"
version = "1.0.0"
id = "artifacts/3d-shooter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22546

[services.development]
run = "pnpm --filter @workspace/3d-shooter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/3d-shooter", "run", "build" ]
publicDir = "artifacts/3d-shooter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22546"
BASE_PATH = "/"
